<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02050d" />
  <title>Teléfono de la Cava</title>

  <style>
    :root{
      --text:#ffffff;
      --muted:rgba(255,255,255,.78);
      --line:rgba(225,238,255,.34);
      --glass:rgba(3,8,18,.30);
      --glass-pressed:rgba(126,178,255,.22);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#02050d;
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body{
      overflow:hidden;
      overscroll-behavior:none;
    }

    .app{
      position:relative;
      width:100%;
      height:100svh;
      min-height:560px;
      overflow:hidden;
      isolation:isolate;
      background:#02050d;
    }

    /* Fondo espacial real en HD */
    .space-bg{
      position:absolute;
      inset:0;
      z-index:-20;
      background-position:center;
      background-size:cover;
      background-repeat:no-repeat;
      transform:scale(1.01);
    }

    .shade{
      position:absolute;
      inset:0;
      z-index:-18;
      pointer-events:none;
      background:
        linear-gradient(180deg,rgba(0,2,8,.22),rgba(0,2,8,.03) 28%,rgba(0,2,8,.04) 72%,rgba(0,2,8,.18)),
        radial-gradient(circle at center,transparent 48%,rgba(0,0,0,.18));
    }

    .event-layer{
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
      overflow:hidden;
    }

    .ui{
      position:relative;
      z-index:10;
      width:min(100%,560px);
      height:100%;
      margin:0 auto;
      padding:
        max(18px,env(safe-area-inset-top))
        18px
        max(16px,env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .header{
      width:100%;
      text-align:center;
      margin-bottom:clamp(12px,2vh,20px);
      text-shadow:0 2px 12px rgba(0,0,0,.88);
    }

    .kicker{
      margin:0 0 8px;
      font-size:clamp(.64rem,2.5vw,.82rem);
      letter-spacing:.33em;
      text-transform:uppercase;
      color:rgba(255,255,255,.78);
      font-weight:500;
    }

    h1{
      margin:0;
      font-size:clamp(1.72rem,7vw,2.75rem);
      line-height:1;
      font-weight:760;
      text-transform:uppercase;
      letter-spacing:.045em;
    }

    .sub{
      margin:11px auto 0;
      max-width:430px;
      color:rgba(255,255,255,.83);
      font-size:clamp(.83rem,3.1vw,1rem);
      line-height:1.35;
      text-shadow:0 2px 9px rgba(0,0,0,.95);
    }

    .keypad{
      width:min(82vw,390px);
      display:grid;
      grid-template-columns:repeat(3,1fr);
      justify-items:center;
      gap:clamp(10px,2.5vw,16px);
    }

    .key{
      appearance:none;
      -webkit-appearance:none;
      width:clamp(69px,21vw,104px);
      aspect-ratio:1;
      border-radius:50%;
      border:1px solid var(--line);
      background:
        radial-gradient(circle at 35% 25%,rgba(255,255,255,.08),transparent 42%),
        var(--glass);
      color:#fff;
      font-size:clamp(2rem,8.2vw,3.15rem);
      font-weight:260;
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      text-shadow:0 2px 10px rgba(0,0,0,.85);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.025),0 6px 20px rgba(0,0,0,.28);
      transition:transform .10s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease;
    }

    .key:active,.key.pressed{
      transform:scale(.91);
      border-color:rgba(255,255,255,.92);
      background:var(--glass-pressed);
      box-shadow:0 0 0 3px rgba(165,210,255,.08),0 0 28px rgba(135,190,255,.28);
    }

    .key.empty{
      opacity:.82;
    }

    .zero{grid-column:2}

    .status{
      min-height:22px;
      margin-top:clamp(12px,2vh,18px);
      font-size:clamp(.64rem,2.5vw,.8rem);
      letter-spacing:.21em;
      text-transform:uppercase;
      color:rgba(255,255,255,.72);
      text-shadow:0 2px 9px rgba(0,0,0,.95);
      text-align:center;
    }

    /* ======================================================
       OBJETOS PIXEL / BLOQUE
       Estilo videojuego blocky, sin fotos pegadas.
       ====================================================== */

    .pixel-object{
      position:absolute;
      image-rendering:pixelated;
      will-change:transform;
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));
    }

    /* Astronauta pixelado */
    .px-astro{
      top:7%;
      left:-130px;
      width:86px;
      height:116px;
      animation:astroPass 17s linear forwards;
    }
    .px-astro .helmet{
      position:absolute;left:24px;top:0;width:40px;height:34px;
      background:#e8eef4;border:5px solid #9daab5;
      box-shadow:inset 0 0 0 5px #223447;
    }
    .px-astro .body{
      position:absolute;left:20px;top:34px;width:48px;height:50px;
      background:#e3e8ec;border:5px solid #9daab5;
    }
    .px-astro .pack{
      position:absolute;left:10px;top:38px;width:18px;height:40px;
      background:#6c7884;
    }
    .px-astro .arm1,.px-astro .arm2{
      position:absolute;top:42px;width:13px;height:48px;background:#dce3e8;
      border:4px solid #9daab5;
    }
    .px-astro .arm1{left:4px;transform:rotate(32deg);transform-origin:top}
    .px-astro .arm2{right:4px;transform:rotate(-28deg);transform-origin:top}
    .px-astro .leg1,.px-astro .leg2{
      position:absolute;top:81px;width:17px;height:34px;background:#dfe5e9;
      border:4px solid #9daab5;
    }
    .px-astro .leg1{left:23px;transform:rotate(10deg)}
    .px-astro .leg2{right:18px;transform:rotate(-11deg)}
    .px-astro .panel{
      position:absolute;left:31px;top:50px;width:25px;height:16px;
      background:#54616d;border:3px solid #aeb9c2;
    }
    .px-astro .light{
      position:absolute;width:4px;height:4px;background:#ff6a6a;left:36px;top:56px;
      box-shadow:8px 0 0 #67d5ff;
    }

    @keyframes astroPass{
      0%{transform:translateX(-12vw) translateY(0) rotate(-10deg)}
      50%{transform:translateX(58vw) translateY(10px) rotate(4deg)}
      100%{transform:translateX(125vw) translateY(-5px) rotate(15deg)}
    }

    /* Satélite pixelado */
    .px-sat{
      top:11%;
      left:-160px;
      width:130px;
      height:72px;
      animation:satPass 14s linear forwards;
    }
    .px-sat .core{
      position:absolute;left:46px;top:20px;width:38px;height:32px;
      background:#bcc7cf;border:4px solid #66727c;
    }
    .px-sat .dish{
      position:absolute;left:52px;top:2px;width:24px;height:17px;
      background:#e1e7eb;border:4px solid #8996a0;
      clip-path:polygon(0 0,100% 0,76% 100%,24% 100%);
    }
    .px-sat .wing1,.px-sat .wing2{
      position:absolute;top:22px;width:40px;height:28px;
      background:
        linear-gradient(90deg,transparent 31%,rgba(255,255,255,.18) 31% 35%,transparent 35% 65%,rgba(255,255,255,.18) 65% 69%,transparent 69%),
        linear-gradient(#123c70 48%,#0a2a56 48%);
      border:3px solid #79a9d7;
    }
    .px-sat .wing1{left:0}
    .px-sat .wing2{right:0}

    @keyframes satPass{
      from{transform:translateX(-12vw) rotate(-8deg)}
      to{transform:translateX(128vw) translateY(32px) rotate(9deg)}
    }

    /* Asteroide bloque */
    .px-rock{
      top:12%;
      right:-120px;
      width:90px;height:76px;
      animation:rockPass 11s linear forwards;
    }
    .px-rock .b1,.px-rock .b2,.px-rock .b3,.px-rock .b4,.px-rock .b5{
      position:absolute;background:#514b46;
      box-shadow:inset -8px -8px 0 rgba(0,0,0,.22),inset 6px 6px 0 rgba(255,255,255,.05);
    }
    .px-rock .b1{left:18px;top:8px;width:50px;height:48px}
    .px-rock .b2{left:5px;top:22px;width:26px;height:28px}
    .px-rock .b3{right:5px;top:18px;width:24px;height:30px}
    .px-rock .b4{left:28px;bottom:2px;width:34px;height:24px}
    .px-rock .b5{left:35px;top:20px;width:14px;height:11px;background:#2c2927}

    @keyframes rockPass{
      0%{transform:translate(10vw,-5vh) rotate(0deg) scale(.8)}
      100%{transform:translate(-135vw,55vh) rotate(300deg) scale(1.05)}
    }

    /* Planeta pixelado */
    .px-planet{
      top:6%;
      right:-95px;
      width:180px;height:180px;
      border-radius:50%;
      background:
        repeating-linear-gradient(
          0deg,
          #7b6b55 0 14px,
          #9c8665 14px 26px,
          #51483d 26px 38px,
          #7f715c 38px 50px
        );
      box-shadow:
        inset -42px -28px 0 rgba(0,0,0,.35),
        0 0 0 6px rgba(255,255,255,.04);
      animation:planetPeek 12s ease-in-out forwards;
      opacity:0;
    }
    .px-planet::after{
      content:"";
      position:absolute;inset:0;border-radius:50%;
      background:
        linear-gradient(90deg,transparent 40%,rgba(0,0,0,.22) 40% 45%,transparent 45%),
        linear-gradient(transparent 32%,rgba(255,255,255,.05) 32% 37%,transparent 37%);
      mix-blend-mode:overlay;
    }

    @keyframes planetPeek{
      0%{opacity:0;transform:translateX(45px) scale(.88)}
      18%,78%{opacity:.94;transform:translateX(0) scale(1)}
      100%{opacity:0;transform:translateX(20px) scale(1.03)}
    }

    /* Estrella fugaz */
    .meteor{
      position:absolute;
      width:150px;
      height:2px;
      opacity:0;
      background:linear-gradient(90deg,transparent,rgba(210,235,255,.18) 40%,#fff);
      transform:rotate(-23deg);
      animation:meteorPass 1.1s ease-out forwards;
    }

    @keyframes meteorPass{
      0%{opacity:0;transform:translate(-20vw,-10vh) rotate(-23deg) scaleX(.45)}
      14%{opacity:1}
      100%{opacity:0;transform:translate(120vw,44vh) rotate(-23deg) scaleX(1)}
    }

    @media(max-height:700px){
      .ui{justify-content:flex-start;padding-top:13px}
      .header{margin-bottom:9px}
      .sub{margin-top:7px}
      .keypad{gap:9px}
      .key{width:min(19vw,84px)}
      .status{margin-top:9px}
    }

    @media(prefers-reduced-motion:reduce){
      .pixel-object,.meteor{display:none!important}
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="spaceBg" class="space-bg"></div>
    <div class="shade"></div>
    <div id="eventLayer" class="event-layer" aria-hidden="true"></div>

    <section class="ui">
      <header class="header">
        <p class="kicker">Teléfono de la cava</p>
        <h1>Marque una selección</h1>
        <p class="sub">Elegí un número. Cada línea conecta con una playlist distinta.</p>
      </header>

      <div class="keypad">
        <button class="key" data-number="1">1</button>
        <button class="key empty" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key empty" data-number="9">9</button>
        <button class="key zero empty" data-number="0">0</button>
      </div>

      <div id="status" class="status" aria-live="polite">línea disponible</div>
    </section>
  </main>

  <script>
    /* ============================================================
       PLAYLISTS
       Dejamos VACÍOS los botones que todavía no definiste: 2, 9 y 0.
       ============================================================ */
    const selections = {
      "1": {
        name: "Para empezar",
        url: "https://open.spotify.com/playlist/16QguuMuZbadn8Ll3exMpS"
      },
      "2": {
        name: "",
        url: ""
      },
      "3": {
        name: "Música disco",
        url: "https://open.spotify.com/playlist/6Gt1cg31kgPw5FYleLDRSn"
      },
      "4": {
        name: "Clásicos",
        url: "https://open.spotify.com/playlist/2nVzXCq0Bq9rVzWQgB9BWk"
      },
      "5": {
        name: "SebasWit",
        url: "https://open.spotify.com/playlist/7t1n4P09hI38P8m9RKP7XN"
      },
      "6": {
        name: "80's",
        url: "https://open.spotify.com/playlist/7Kfq8BGOINhjpMcU5nSiZL"
      },
      "7": {
        name: "Electrónica",
        url: "https://open.spotify.com/playlist/5B3yHgvHrnwSit19JeezPv"
      },
      "8": {
        name: "Lentos",
        url: "https://open.spotify.com/playlist/0Fhptdnst41dPQG1FXgLog"
      },
      "9": {
        name: "",
        url: ""
      },
      "0": {
        name: "",
        url: ""
      }
    };

    /* ============================================================
       FONDOS WEBB / NASA HD
       ============================================================ */
    const backgrounds = [
      "https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2023/10/STScI-01HBBMF6GFYQG7ECGX1WD3W92B.png?crop=faces%2Cfocalpoint&fit=clip&h=1916&w=2200",
      "https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2024/03/STScI-01HQNVF0HHRF5HH4HKH8S9C83X.png?crop=faces%2Cfocalpoint&fit=clip&h=1785&w=2200",
      "https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2026/02/STScI-01K843KG664WG1FD061J0AFCSH.jpg?crop=faces%2Cfocalpoint&fit=clip&h=1260&w=2450"
    ];

    document.getElementById("spaceBg").style.backgroundImage =
      `url("${backgrounds[Math.floor(Math.random()*backgrounds.length)]}")`;

    const statusEl = document.getElementById("status");
    const eventLayer = document.getElementById("eventLayer");
    const keys = [...document.querySelectorAll(".key")];

    /* SONIDO TIT */
    function beep(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        const ctx = new AC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(930,ctx.currentTime);
        gain.gain.setValueAtTime(.0001,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.008);
        gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.15);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime+.16);
        osc.onended = ()=>ctx.close();
      }catch(e){}
    }

    /* ============================================================
       IMPORTANTE:
       Abrir una URL de Spotify NO permite forzar "shuffle" ni
       autorreproducción desde una web estática.
       Eso lo haremos después con Spotify Web API + tu cuenta Premium.
       ============================================================ */
    keys.forEach(btn=>{
      btn.addEventListener("click",()=>{
        const n = btn.dataset.number;
        const item = selections[n];

        beep();
        btn.classList.add("pressed");
        setTimeout(()=>btn.classList.remove("pressed"),170);

        if(!item || !item.url){
          statusEl.textContent = "línea disponible";
          return;
        }

        statusEl.textContent = `conectando · ${item.name}`;

        setTimeout(()=>{
          window.location.href = item.url;
        },300);
      });
    });

    /* ============================================================
       EVENTOS VISUALES BLOCKY
       ============================================================ */
    function add(html,cls,life){
      const el = document.createElement("div");
      el.className = "pixel-object " + cls;
      el.innerHTML = html;
      eventLayer.appendChild(el);
      setTimeout(()=>el.remove(),life);
    }

    function astronaut(){
      add(`
        <div class="helmet"></div>
        <div class="pack"></div>
        <div class="body"></div>
        <div class="arm1"></div>
        <div class="arm2"></div>
        <div class="leg1"></div>
        <div class="leg2"></div>
        <div class="panel"></div>
        <div class="light"></div>
      `,"px-astro",18000);
    }

    function satellite(){
      add(`
        <div class="wing1"></div>
        <div class="wing2"></div>
        <div class="core"></div>
        <div class="dish"></div>
      `,"px-sat",15000);
    }

    function asteroid(){
      add(`
        <div class="b1"></div>
        <div class="b2"></div>
        <div class="b3"></div>
        <div class="b4"></div>
        <div class="b5"></div>
      `,"px-rock",12000);
    }

    function planet(){
      const el = document.createElement("div");
      el.className = "pixel-object px-planet";
      eventLayer.appendChild(el);
      setTimeout(()=>el.remove(),13000);
    }

    function meteor(){
      const el = document.createElement("div");
      el.className = "meteor";
      el.style.top = `${8 + Math.random()*38}%`;
      el.style.left = `${-24 + Math.random()*8}%`;
      eventLayer.appendChild(el);
      setTimeout(()=>el.remove(),1400);
    }

    const events = [astronaut,satellite,asteroid,planet];

    const first = events[Math.floor(Math.random()*events.length)];
    setTimeout(first,1000 + Math.random()*1200);

    setTimeout(()=>{
      let second;
      do{
        second = events[Math.floor(Math.random()*events.length)];
      }while(second === first);
      second();
    },15000 + Math.random()*6000);

    function scheduleMeteor(){
      setTimeout(()=>{
        meteor();
        scheduleMeteor();
      },7000 + Math.random()*10000);
    }
    scheduleMeteor();
  </script>
</body>
</html>
