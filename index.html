<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b18" />
  <title>La Cava de Facu y Sebas</title>

  <style>
    :root{
      --bg:#070b18;
      --bg-2:#0d1428;
      --bg-3:#16112d;
      --button:#0a1020;
      --button-2:#10182d;
      --line:rgba(182,203,255,.28);
      --text:#f7f8ff;
      --muted:rgba(247,248,255,.72);
      --accent:#c6d7ff;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body{
      overflow:hidden;
      overscroll-behavior:none;
    }

    .app{
      position:relative;
      width:100%;
      height:100svh;
      min-height:560px;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(circle at 18% 22%, #1e2250 0 9%, transparent 10%),
        radial-gradient(circle at 77% 27%, #182f57 0 8%, transparent 9%),
        radial-gradient(circle at 58% 80%, #281942 0 10%, transparent 11%),
        linear-gradient(160deg,var(--bg),var(--bg-2) 52%,var(--bg-3));
    }

    /* Universo animado tipo dibujo */
    .space{
      position:absolute;
      inset:0;
      z-index:-10;
      overflow:hidden;
    }

    .stars{
      position:absolute;
      inset:0;
      background-image:
        radial-gradient(circle,#fff 0 1px,transparent 1.6px),
        radial-gradient(circle,#9db7ff 0 1px,transparent 1.6px),
        radial-gradient(circle,#ffe6a6 0 1px,transparent 1.7px);
      background-size:91px 91px,137px 137px,219px 219px;
      background-position:8px 13px,51px 72px,120px 35px;
      opacity:.72;
    }

    .nebula-band{
      position:absolute;
      width:140%;
      height:240px;
      left:-20%;
      top:34%;
      transform:rotate(-14deg);
      background:
        linear-gradient(90deg,
          transparent 0%,
          rgba(118,104,216,.08) 12%,
          rgba(96,125,213,.22) 35%,
          rgba(148,86,190,.16) 58%,
          rgba(85,119,190,.18) 76%,
          transparent 100%);
      border-top:1px solid rgba(190,205,255,.06);
      border-bottom:1px solid rgba(190,205,255,.05);
    }

    .planet{
      position:absolute;
      border-radius:50%;
      box-shadow:inset -16px -18px 0 rgba(0,0,0,.22);
    }

    .planet.one{
      width:90px;height:90px;
      right:-26px;top:14%;
      background:
        linear-gradient(180deg,#7b6fa9 0 18%,#5d5b92 18% 34%,#8a789f 34% 52%,#514d7b 52% 72%,#786987 72%);
    }

    .planet.two{
      width:54px;height:54px;
      left:7%;bottom:13%;
      background:
        linear-gradient(180deg,#466985 0 25%,#315571 25% 50%,#587e9a 50% 68%,#25465e 68%);
    }

    .ring{
      position:absolute;
      right:-38px;
      top:17%;
      width:124px;height:24px;
      border:3px solid rgba(211,218,255,.32);
      border-radius:50%;
      transform:rotate(-14deg);
    }

    .moon{
      position:absolute;
      width:30px;height:30px;
      border-radius:50%;
      left:13%;
      top:13%;
      background:#aab3cc;
      box-shadow:
        inset -8px -8px 0 rgba(0,0,0,.18),
        6px 8px 0 -5px #7f89a1,
        -4px -5px 0 -4px #8993aa;
    }

    /* Objetos cartoon */
    .object-layer{
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
      overflow:hidden;
    }

    .cartoon-astro{
      position:absolute;
      top:7%;
      left:-120px;
      width:86px;height:112px;
      animation:astroFloat 18s linear forwards;
    }
    .cartoon-astro .helmet{
      position:absolute;left:20px;top:0;width:46px;height:40px;
      border-radius:45% 45% 40% 40%;
      background:#e7edf7;
      border:4px solid #9da9bc;
    }
    .cartoon-astro .visor{
      position:absolute;left:28px;top:9px;width:30px;height:22px;
      border-radius:50%;
      background:linear-gradient(135deg,#6e7e9b,#1e2a40);
      border:3px solid #cfd9e8;
    }
    .cartoon-astro .body{
      position:absolute;left:24px;top:38px;width:38px;height:42px;
      border-radius:8px;
      background:#dde4ef;
      border:4px solid #9da9bc;
    }
    .cartoon-astro .pack{
      position:absolute;left:12px;top:42px;width:18px;height:34px;
      border-radius:4px;
      background:#737f91;
    }
    .cartoon-astro .arm{
      position:absolute;top:44px;width:12px;height:42px;
      background:#dce4ef;border:3px solid #9da9bc;border-radius:5px;
    }
    .cartoon-astro .arm.a{left:6px;transform:rotate(34deg);transform-origin:top}
    .cartoon-astro .arm.b{right:7px;transform:rotate(-34deg);transform-origin:top}
    .cartoon-astro .leg{
      position:absolute;top:76px;width:14px;height:34px;
      background:#dce4ef;border:3px solid #9da9bc;border-radius:5px;
    }
    .cartoon-astro .leg.a{left:26px;transform:rotate(9deg)}
    .cartoon-astro .leg.b{right:22px;transform:rotate(-9deg)}

    @keyframes astroFloat{
      0%{transform:translateX(-10vw) translateY(0) rotate(-8deg)}
      50%{transform:translateX(60vw) translateY(10px) rotate(4deg)}
      100%{transform:translateX(126vw) translateY(-5px) rotate(14deg)}
    }

    .cartoon-sat{
      position:absolute;
      top:10%;
      left:-150px;
      width:130px;height:70px;
      animation:satMove 15s linear forwards;
    }
    .cartoon-sat .core{
      position:absolute;left:48px;top:20px;width:34px;height:30px;
      background:#aeb9c8;border:4px solid #6f7c8e;border-radius:5px;
    }
    .cartoon-sat .wing{
      position:absolute;top:24px;width:42px;height:24px;
      background:
        linear-gradient(90deg,transparent 30%,rgba(255,255,255,.15) 30% 35%,transparent 35% 65%,rgba(255,255,255,.15) 65% 70%,transparent 70%),
        #1e4a7a;
      border:3px solid #6e9fc8;
    }
    .cartoon-sat .wing.a{left:0}
    .cartoon-sat .wing.b{right:0}
    .cartoon-sat .dish{
      position:absolute;left:55px;top:2px;width:20px;height:16px;
      border-radius:50% 50% 20% 20%;
      background:#d9e0ea;border:3px solid #8792a0;
    }

    @keyframes satMove{
      from{transform:translateX(-12vw) rotate(-8deg)}
      to{transform:translateX(128vw) translateY(34px) rotate(9deg)}
    }

    .asteroid{
      position:absolute;
      right:-110px;
      top:12%;
      width:74px;height:60px;
      animation:rockMove 11s linear forwards;
    }
    .asteroid span{
      position:absolute;background:#5d5660;
      box-shadow:inset -7px -7px 0 rgba(0,0,0,.18),inset 5px 5px 0 rgba(255,255,255,.04);
    }
    .asteroid .a{left:14px;top:7px;width:44px;height:38px}
    .asteroid .b{left:3px;top:20px;width:22px;height:24px}
    .asteroid .c{right:2px;top:18px;width:22px;height:26px}
    .asteroid .d{left:26px;bottom:0;width:30px;height:22px}

    @keyframes rockMove{
      from{transform:translate(10vw,-5vh) rotate(0deg) scale(.82)}
      to{transform:translate(-135vw,54vh) rotate(320deg) scale(1.06)}
    }

    .shooting{
      position:absolute;
      width:145px;height:2px;
      background:linear-gradient(90deg,transparent,rgba(188,220,255,.35),#fff);
      opacity:0;
      transform:rotate(-22deg);
      animation:shoot 1.05s ease-out forwards;
    }

    @keyframes shoot{
      0%{opacity:0;transform:translate(-20vw,-10vh) rotate(-22deg) scaleX(.45)}
      15%{opacity:1}
      100%{opacity:0;transform:translate(120vw,42vh) rotate(-22deg) scaleX(1)}
    }

    /* UI */
    .ui{
      position:relative;
      z-index:10;
      width:min(100%,560px);
      height:100%;
      margin:0 auto;
      padding:
        max(18px,env(safe-area-inset-top))
        18px
        max(16px,env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .header{
      text-align:center;
      width:100%;
      margin-bottom:clamp(12px,2vh,20px);
      text-shadow:0 2px 12px rgba(0,0,0,.8);
    }

    .kicker{
      margin:0 0 8px;
      font-size:clamp(.62rem,2.5vw,.82rem);
      letter-spacing:.33em;
      text-transform:uppercase;
      color:rgba(255,255,255,.75);
    }

    h1{
      margin:0;
      font-size:clamp(1.72rem,7vw,2.75rem);
      line-height:1;
      font-weight:760;
      text-transform:uppercase;
      letter-spacing:.045em;
    }

    .sub{
      margin:11px auto 0;
      max-width:430px;
      color:rgba(255,255,255,.80);
      font-size:clamp(.83rem,3.1vw,1rem);
      line-height:1.35;
    }

    .keypad{
      width:min(82vw,390px);
      display:grid;
      grid-template-columns:repeat(3,1fr);
      justify-items:center;
      gap:clamp(10px,2.5vw,16px);
    }

    .key{
      appearance:none;
      -webkit-appearance:none;
      width:clamp(69px,21vw,104px);
      aspect-ratio:1;
      border-radius:50%;
      border:1px solid var(--line);
      background:
        linear-gradient(180deg,var(--button-2),var(--button));
      color:#fff;
      font-size:clamp(2rem,8.2vw,3.15rem);
      font-weight:260;
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      text-shadow:0 2px 8px rgba(0,0,0,.8);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.02),0 5px 16px rgba(0,0,0,.24);
      transition:transform .10s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease;
    }

    .key:active,.key.pressed{
      transform:scale(.91);
      border-color:rgba(255,255,255,.88);
      background:#18223b;
      box-shadow:0 0 24px rgba(140,184,255,.20);
    }

    .zero{grid-column:2}

    .status{
      min-height:22px;
      margin-top:clamp(12px,2vh,18px);
      font-size:clamp(.64rem,2.5vw,.8rem);
      letter-spacing:.20em;
      text-transform:uppercase;
      color:rgba(255,255,255,.72);
      text-align:center;
      text-shadow:0 2px 9px rgba(0,0,0,.85);
    }

    /* Pantalla inicial para habilitar audio */
    .start-overlay{
      position:absolute;
      inset:0;
      z-index:50;
      display:grid;
      place-items:center;
      padding:24px;
      background:rgba(5,8,18,.72);
      backdrop-filter:blur(3px);
    }

    .start-card{
      width:min(90vw,390px);
      text-align:center;
      padding:24px 20px;
      border:1px solid rgba(213,226,255,.20);
      border-radius:24px;
      background:rgba(10,15,30,.88);
      box-shadow:0 18px 50px rgba(0,0,0,.35);
    }

    .start-card .phone{
      font-size:2.5rem;
      margin-bottom:10px;
    }

    .start-card h2{
      margin:0 0 8px;
      font-size:1.35rem;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .start-card p{
      margin:0 0 18px;
      color:rgba(255,255,255,.72);
      line-height:1.4;
      font-size:.95rem;
    }

    .start-btn{
      width:100%;
      min-height:50px;
      border:none;
      border-radius:14px;
      background:#e8edf8;
      color:#111827;
      font-size:1rem;
      font-weight:700;
      letter-spacing:.06em;
      cursor:pointer;
    }

    .hidden{display:none!important}

    @media(max-height:700px){
      .ui{justify-content:flex-start;padding-top:13px}
      .header{margin-bottom:9px}
      .sub{margin-top:7px}
      .keypad{gap:9px}
      .key{width:min(19vw,84px)}
      .status{margin-top:9px}
    }

    @media(prefers-reduced-motion:reduce){
      .cartoon-astro,.cartoon-sat,.asteroid,.shooting{display:none!important}
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="space">
      <div class="stars"></div>
      <div class="nebula-band"></div>
      <div class="planet one"></div>
      <div class="ring"></div>
      <div class="planet two"></div>
      <div class="moon"></div>
    </div>

    <div id="objectLayer" class="object-layer"></div>

    <section class="ui">
      <header class="header">
        <p class="kicker">La cava de Facu y Sebas</p>
        <h1>Marque una selección</h1>
        <p class="sub">Elegí un número y descubrí la música.</p>
      </header>

      <div class="keypad">
        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key zero" data-number="0">0</button>
      </div>

      <div id="status" class="status" aria-live="polite">línea disponible</div>
    </section>

    <div id="startOverlay" class="start-overlay">
      <div class="start-card">
        <div class="phone">☎️</div>
        <h2>La cava está lista</h2>
        <p>Tocá para activar el sonido y comenzar la experiencia.</p>
        <button id="startBtn" class="start-btn" type="button">ENTRAR</button>
      </div>
    </div>
  </main>

  <script>
    /* ============================================================
       PLAYLISTS
       Dejamos 2, 9 y 0 vacíos.
       ============================================================ */
    const selections = {
      "1": { name:"Para empezar", url:"https://open.spotify.com/playlist/16QguuMuZbadn8Ll3exMpS" },
      "2": { name:"", url:"" },
      "3": { name:"Música disco", url:"https://open.spotify.com/playlist/6Gt1cg31kgPw5FYleLDRSn" },
      "4": { name:"Clásicos", url:"https://open.spotify.com/playlist/2nVzXCq0Bq9rVzWQgB9BWk" },
      "5": { name:"SebasWit", url:"https://open.spotify.com/playlist/7t1n4P09hI38P8m9RKP7XN" },
      "6": { name:"80's", url:"https://open.spotify.com/playlist/7Kfq8BGOINhjpMcU5nSiZL" },
      "7": { name:"Electrónica", url:"https://open.spotify.com/playlist/5B3yHgvHrnwSit19JeezPv" },
      "8": { name:"Lentos", url:"https://open.spotify.com/playlist/0Fhptdnst41dPQG1FXgLog" },
      "9": { name:"", url:"" },
      "0": { name:"", url:"" }
    };

    const statusEl = document.getElementById("status");
    const keys = [...document.querySelectorAll(".key")];
    const objectLayer = document.getElementById("objectLayer");
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");

    let audioCtx = null;
    let windNode = null;
    let windGain = null;

    /* ============================================================
       VOZ
       ============================================================ */
    function speakWelcome(){
      if(!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      const text = "Bienvenido a la cava de Facu y Sebas. Presiona uno de los botones y descubre la música que tenemos para vos.";
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "es-AR";
      u.rate = 0.93;
      u.pitch = 0.95;
      u.volume = 0.95;

      const voices = window.speechSynthesis.getVoices();
      const ar = voices.find(v => /es-AR/i.test(v.lang));
      const es = voices.find(v => /^es/i.test(v.lang));
      if(ar || es) u.voice = ar || es;

      window.speechSynthesis.speak(u);
    }

    /* ============================================================
       VIENTO ESPACIAL SUAVE
       ruido filtrado, muy bajito.
       ============================================================ */
    function startWind(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();

        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);

        for(let i=0;i<bufferSize;i++){
          data[i] = (Math.random()*2-1) * 0.28;
        }

        windNode = audioCtx.createBufferSource();
        windNode.buffer = buffer;
        windNode.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 700;
        filter.Q.value = 0.7;

        windGain = audioCtx.createGain();
        windGain.gain.value = 0.025;

        windNode.connect(filter);
        filter.connect(windGain);
        windGain.connect(audioCtx.destination);

        windNode.start();
      }catch(e){}
    }

    /* ============================================================
       ACTIVACIÓN DE EXPERIENCIA
       necesario en móviles para permitir voz/sonido.
       ============================================================ */
    startBtn.addEventListener("click",()=>{
      startOverlay.classList.add("hidden");
      startWind();
      setTimeout(speakWelcome,250);
    });

    /* TIT DEL BOTÓN */
    function beep(){
      try{
        if(!audioCtx){
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(930,audioCtx.currentTime);
        gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.16,audioCtx.currentTime+.008);
        gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.14);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime+.15);
      }catch(e){}
    }

    keys.forEach(btn=>{
      btn.addEventListener("click",()=>{
        const n = btn.dataset.number;
        const item = selections[n];

        beep();
        btn.classList.add("pressed");
        setTimeout(()=>btn.classList.remove("pressed"),160);

        if(!item || !item.url){
          statusEl.textContent = "línea disponible";
          return;
        }

        statusEl.textContent = `conectando · ${item.name}`;

        setTimeout(()=>{
          window.location.href = item.url;
        },320);
      });
    });

    /* ============================================================
       OBJETOS CARTOON ALEATORIOS
       ============================================================ */
    function astronaut(){
      const el = document.createElement("div");
      el.className = "cartoon-astro";
      el.innerHTML = `
        <div class="helmet"></div><div class="visor"></div>
        <div class="pack"></div><div class="body"></div>
        <div class="arm a"></div><div class="arm b"></div>
        <div class="leg a"></div><div class="leg b"></div>
      `;
      objectLayer.appendChild(el);
      setTimeout(()=>el.remove(),19000);
    }

    function satellite(){
      const el = document.createElement("div");
      el.className = "cartoon-sat";
      el.innerHTML = `
        <div class="wing a"></div><div class="wing b"></div>
        <div class="core"></div><div class="dish"></div>
      `;
      objectLayer.appendChild(el);
      setTimeout(()=>el.remove(),16000);
    }

    function asteroid(){
      const el = document.createElement("div");
      el.className = "asteroid";
      el.innerHTML = `<span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span>`;
      objectLayer.appendChild(el);
      setTimeout(()=>el.remove(),12000);
    }

    function shootingStar(){
      const el = document.createElement("div");
      el.className = "shooting";
      el.style.top = `${8 + Math.random()*42}%`;
      el.style.left = `${-25 + Math.random()*7}%`;
      objectLayer.appendChild(el);
      setTimeout(()=>el.remove(),1400);
    }

    const events = [astronaut,satellite,asteroid];
    const first = events[Math.floor(Math.random()*events.length)];

    setTimeout(first,1400 + Math.random()*1000);

    setTimeout(()=>{
      let second;
      do{
        second = events[Math.floor(Math.random()*events.length)];
      }while(second === first);
      second();
    },15000 + Math.random()*5500);

    function scheduleStar(){
      setTimeout(()=>{
        shootingStar();
        scheduleStar();
      },6500 + Math.random()*9000);
    }
    scheduleStar();
  </script>
</body>
</html>
