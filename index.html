<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05030b" />
  <title>Teléfono de la Cava</title>

  <style>
    :root{
      --bg-1:#05030b;
      --bg-2:#0b0a22;
      --bg-3:#150c2a;
      --panel:rgba(9,10,24,.42);
      --line:rgba(255,255,255,.16);
      --text:#f7f7fb;
      --muted:rgba(255,255,255,.58);
      --glow:rgba(255,255,255,.18);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg-1);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow:hidden}

    .app{
      position:relative;
      min-height:100svh;
      width:100%;
      display:grid;
      place-items:center;
      isolation:isolate;
      background:
        radial-gradient(circle at 18% 22%, rgba(110,65,180,.17), transparent 28%),
        radial-gradient(circle at 77% 30%, rgba(28,82,145,.18), transparent 30%),
        radial-gradient(circle at 62% 82%, rgba(143,32,92,.12), transparent 29%),
        linear-gradient(160deg,var(--bg-1),var(--bg-2) 46%,var(--bg-3));
    }

    /* Nebulosa fija */
    .nebula,
    .nebula::before,
    .nebula::after{
      position:absolute;
      inset:-8%;
      content:"";
      pointer-events:none;
      z-index:-5;
      filter:blur(30px);
    }
    .nebula{
      background:
        radial-gradient(ellipse at 22% 43%, rgba(157,96,255,.18), transparent 34%),
        radial-gradient(ellipse at 72% 30%, rgba(60,144,255,.12), transparent 30%),
        radial-gradient(ellipse at 61% 76%, rgba(255,91,163,.09), transparent 34%);
    }
    .nebula::before{
      background:radial-gradient(ellipse at 35% 65%, rgba(91,193,255,.08), transparent 28%);
    }
    .nebula::after{
      background:radial-gradient(ellipse at 82% 62%, rgba(255,120,88,.07), transparent 26%);
    }

    /* Estrellas de fondo estáticas */
    .stars{
      position:absolute;
      inset:0;
      z-index:-4;
      pointer-events:none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.95) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(255,255,255,.62) 0 1px, transparent 1.3px),
        radial-gradient(circle, rgba(165,190,255,.55) 0 1px, transparent 1.2px);
      background-size:89px 89px, 137px 137px, 211px 211px;
      background-position:3px 11px, 34px 58px, 92px 17px;
      opacity:.68;
    }

    .vignette{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:20;
      box-shadow:inset 0 0 140px rgba(0,0,0,.7);
    }

    .content{
      width:min(92vw,560px);
      position:relative;
      z-index:10;
      padding:24px 16px 28px;
      text-align:center;
    }

    .eyebrow{
      font-size:.72rem;
      letter-spacing:.34em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:10px;
    }

    h1{
      margin:0 0 8px;
      font-size:clamp(1.6rem,5vw,2.55rem);
      font-weight:650;
      letter-spacing:.08em;
      text-transform:uppercase;
      text-shadow:0 0 24px rgba(255,255,255,.08);
    }

    .hint{
      margin:0 auto 20px;
      max-width:420px;
      color:rgba(255,255,255,.72);
      font-size:.95rem;
      letter-spacing:.05em;
    }

    .dial{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      width:min(100%,430px);
      margin:0 auto;
      padding:18px;
      border:1px solid var(--line);
      border-radius:30px;
      background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
      backdrop-filter:blur(10px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 20px 50px rgba(0,0,0,.28);
    }

    .key{
      appearance:none;
      -webkit-appearance:none;
      border:1px solid rgba(255,255,255,.17);
      background:
        radial-gradient(circle at 35% 24%, rgba(255,255,255,.095), transparent 44%),
        rgba(7,9,20,.44);
      color:#fff;
      aspect-ratio:1/1;
      min-height:72px;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:clamp(2rem,9vw,3.3rem);
      font-weight:300;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      transition:transform .12s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.025),
        0 8px 22px rgba(0,0,0,.22);
      text-shadow:0 0 16px rgba(255,255,255,.08);
    }

    @media (hover:hover) and (pointer:fine){
      .key:hover{
        transform:translateY(-2px);
        border-color:rgba(255,255,255,.36);
        box-shadow:0 12px 30px rgba(0,0,0,.3),0 0 22px var(--glow);
      }
    }

    .key:active,
    .key.pressed{
      transform:scale(.94);
      background:rgba(255,255,255,.16);
      border-color:rgba(255,255,255,.65);
      box-shadow:0 0 28px rgba(255,255,255,.17);
    }

    .zero{grid-column:2}

    .status{
      min-height:24px;
      margin-top:16px;
      font-size:.78rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(255,255,255,.52);
    }

    /* Objetos cósmicos */
    .cosmic-layer{
      position:absolute;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:2;
    }

    .shooting-star{
      position:absolute;
      width:120px;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));
      opacity:0;
      transform:rotate(-18deg);
      filter:drop-shadow(0 0 4px rgba(255,255,255,.75));
      animation:shoot 1.35s ease-out forwards;
    }

    @keyframes shoot{
      0%{opacity:0;transform:translate(-10vw,-6vh) rotate(-18deg) scaleX(.25)}
      12%{opacity:1}
      100%{opacity:0;transform:translate(115vw,42vh) rotate(-18deg) scaleX(1)}
    }

    .astronaut{
      position:absolute;
      top:8%;
      left:-120px;
      width:74px;
      height:74px;
      opacity:.86;
      animation:drift 17s linear forwards;
      filter:drop-shadow(0 0 10px rgba(255,255,255,.18));
    }
    .astronaut::before{
      content:"🧑‍🚀";
      font-size:64px;
      display:block;
      transform:rotate(14deg);
    }

    @keyframes drift{
      0%{transform:translateX(-12vw) translateY(0) rotate(-8deg)}
      50%{transform:translateX(54vw) translateY(12px) rotate(8deg)}
      100%{transform:translateX(120vw) translateY(-4px) rotate(20deg)}
    }

    .satellite{
      position:absolute;
      top:18%;
      left:-120px;
      font-size:54px;
      opacity:.78;
      animation:satellitePass 14s linear forwards;
      filter:drop-shadow(0 0 8px rgba(140,190,255,.18));
    }
    @keyframes satellitePass{
      from{transform:translateX(-12vw) rotate(-10deg)}
      to{transform:translateX(120vw) rotate(10deg)}
    }

    .sun{
      position:absolute;
      width:170px;
      height:170px;
      border-radius:50%;
      right:-65px;
      top:7%;
      background:radial-gradient(circle at 40% 40%,#fff8cc 0 10%,#ffc56c 25%,#ff7a35 58%,rgba(255,97,30,.2) 75%,transparent 76%);
      box-shadow:0 0 55px rgba(255,143,62,.35),0 0 110px rgba(255,105,48,.18);
      opacity:0;
      animation:sunIn 12s ease-in-out forwards;
    }
    @keyframes sunIn{
      0%{opacity:0;transform:scale(.75)}
      18%,78%{opacity:.74;transform:scale(1)}
      100%{opacity:0;transform:scale(1.06)}
    }

    .planet{
      position:absolute;
      width:145px;
      height:145px;
      border-radius:50%;
      left:-48px;
      bottom:7%;
      background:
        radial-gradient(circle at 30% 28%,rgba(255,255,255,.35),transparent 8%),
        linear-gradient(145deg,#5a6888,#222844 48%,#101423);
      box-shadow:inset -28px -28px 50px rgba(0,0,0,.6),0 0 40px rgba(90,110,170,.12);
      opacity:0;
      animation:planetIn 14s ease-in-out forwards;
    }
    .planet::after{
      content:"";
      position:absolute;
      width:210px;
      height:50px;
      left:-34px;
      top:48px;
      border:5px solid rgba(207,221,255,.33);
      border-radius:50%;
      transform:rotate(-15deg);
    }
    @keyframes planetIn{
      0%{opacity:0;transform:translateX(-28px) scale(.82)}
      22%,78%{opacity:.72;transform:translateX(0) scale(1)}
      100%{opacity:0;transform:translateX(-10px) scale(1.03)}
    }

    .supernova{
      position:absolute;
      left:74%;
      top:18%;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#fff;
      opacity:0;
      animation:burst 5.5s ease-out forwards;
    }
    @keyframes burst{
      0%,18%{opacity:0;box-shadow:0 0 0 rgba(255,255,255,0);transform:scale(.2)}
      25%{opacity:1;box-shadow:0 0 18px #fff,0 0 50px #c8d6ff,0 0 100px #805cff;transform:scale(2.2)}
      42%{opacity:.9;box-shadow:0 0 25px #fff,0 0 80px #ffd2f0,0 0 150px #955cff;transform:scale(5)}
      100%{opacity:0;box-shadow:0 0 0 rgba(255,255,255,0);transform:scale(8)}
    }

    .comet{
      position:absolute;
      right:-100px;
      top:30%;
      width:18px;
      height:18px;
      border-radius:50%;
      background:#e9f6ff;
      box-shadow:0 0 20px rgba(200,230,255,.7);
      animation:cometPass 9s ease-in-out forwards;
      opacity:.9;
    }
    .comet::after{
      content:"";
      position:absolute;
      width:160px;
      height:5px;
      right:10px;
      top:7px;
      background:linear-gradient(90deg,transparent,rgba(150,210,255,.05),rgba(225,245,255,.5));
      filter:blur(2px);
    }
    @keyframes cometPass{
      from{transform:translate(10vw,-10vh) rotate(18deg)}
      to{transform:translate(-130vw,58vh) rotate(18deg)}
    }

    .flash{
      position:absolute;
      inset:0;
      background:rgba(255,255,255,.82);
      opacity:0;
      animation:flash .55s ease-out forwards;
      pointer-events:none;
      z-index:30;
    }
    @keyframes flash{
      0%{opacity:0}
      30%{opacity:.55}
      100%{opacity:0}
    }

    @media (max-width:420px){
      .content{padding-inline:14px}
      .dial{gap:12px;padding:14px;border-radius:26px}
      .key{min-height:66px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="nebula"></div>
    <div class="stars"></div>
    <div id="cosmicLayer" class="cosmic-layer" aria-hidden="true"></div>

    <section class="content" aria-label="Selector musical">
      <div class="eyebrow">Teléfono de la cava</div>
      <h1>Marque una selección</h1>
      <p class="hint">Elegí un número. Cada línea conecta con una playlist distinta.</p>

      <div class="dial" id="dial">
        <button class="key" data-number="1" aria-label="Selección 1">1</button>
        <button class="key" data-number="2" aria-label="Selección 2">2</button>
        <button class="key" data-number="3" aria-label="Selección 3">3</button>
        <button class="key" data-number="4" aria-label="Selección 4">4</button>
        <button class="key" data-number="5" aria-label="Selección 5">5</button>
        <button class="key" data-number="6" aria-label="Selección 6">6</button>
        <button class="key" data-number="7" aria-label="Selección 7">7</button>
        <button class="key" data-number="8" aria-label="Selección 8">8</button>
        <button class="key" data-number="9" aria-label="Selección 9">9</button>
        <button class="key zero" data-number="0" aria-label="Selección 0">0</button>
      </div>

      <div class="status" id="status" aria-live="polite">línea disponible</div>
    </section>

    <div class="vignette"></div>
  </main>

  <script>
    /*
      ==========================================================
      PLAYLISTS
      Reemplazá cada URL por la playlist de Spotify que quieras.
      El 5 queda reservado para SebasWit.
      ==========================================================
    */
    const playlists = {
      "1": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_1",
      "2": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_2",
      "3": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_3",
      "4": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_4",
      "5": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_SEBASWIT",
      "6": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_6",
      "7": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_7",
      "8": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_8",
      "9": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_9",
      "0": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_0"
    };

    const layer = document.getElementById("cosmicLayer");
    const statusEl = document.getElementById("status");
    const keys = [...document.querySelectorAll(".key")];

    /* ---------- SONIDO "TIT" ---------- */
    function beep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);

        osc.onended = () => ctx.close();
      } catch (_) {}
    }

    /* ---------- TECLADO ---------- */
    keys.forEach(key => {
      key.addEventListener("click", () => {
        const n = key.dataset.number;
        const url = playlists[n];

        beep();
        key.classList.add("pressed");
        statusEl.textContent = `conectando selección ${n}`;

        setTimeout(() => key.classList.remove("pressed"), 180);

        // Pequeña pausa para que se llegue a escuchar el "tit"
        setTimeout(() => {
          if (!url || url.includes("PEGA_AQUI")) {
            statusEl.textContent = `falta cargar la playlist ${n}`;
            return;
          }
          window.location.href = url;
        }, 340);
      });
    });

    /* ---------- EVENTOS CÓSMICOS ---------- */
    function addClass(name) {
      const el = document.createElement("div");
      el.className = name;
      layer.appendChild(el);
      return el;
    }

    function astronaut() {
      const el = addClass("astronaut");
      setTimeout(() => el.remove(), 18000);
    }

    function satellite() {
      const el = addClass("satellite");
      el.textContent = "🛰️";
      setTimeout(() => el.remove(), 15000);
    }

    function sun() {
      const el = addClass("sun");
      setTimeout(() => el.remove(), 13000);
    }

    function planet() {
      const el = addClass("planet");
      setTimeout(() => el.remove(), 15000);
    }

    function supernova() {
      const el = addClass("supernova");
      setTimeout(() => {
        const f = addClass("flash");
        setTimeout(() => f.remove(), 700);
      }, 1500);
      setTimeout(() => el.remove(), 6000);
    }

    function comet() {
      const el = addClass("comet");
      setTimeout(() => el.remove(), 10000);
    }

    function shootingStar() {
      const el = addClass("shooting-star");
      el.style.top = `${8 + Math.random() * 50}%`;
      el.style.left = `${-18 + Math.random() * 10}%`;
      setTimeout(() => el.remove(), 1600);
    }

    /*
      Cada vez que abrís la web aparece una escena principal distinta.
      Universo de fondo: fijo.
      Evento: variable.
    */
    const mainScenes = [astronaut, satellite, sun, planet, supernova, comet];
    const chosen = mainScenes[Math.floor(Math.random() * mainScenes.length)];

    setTimeout(chosen, 900 + Math.random() * 1800);

    /*
      Estrellas fugaces ocasionales.
      No son constantes para que el fondo siga sintiéndose quieto.
    */
    function scheduleShootingStar() {
      const wait = 6500 + Math.random() * 11000;
      setTimeout(() => {
        shootingStar();
        scheduleShootingStar();
      }, wait);
    }
    scheduleShootingStar();

    /*
      Cada tanto puede pasar un segundo evento distinto durante una sesión larga.
    */
    setTimeout(() => {
      let another;
      do {
        another = mainScenes[Math.floor(Math.random() * mainScenes.length)];
      } while (another === chosen);
      another();
    }, 18000 + Math.random() * 12000);
  </script>
</body>
</html>
