<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02050d" />
  <title>Teléfono de la Cava</title>

  <style>
    :root{
      --text:#ffffff;
      --muted:rgba(255,255,255,.74);
      --line:rgba(220,235,255,.36);
      --glass:rgba(2,7,18,.30);
      --glass-pressed:rgba(126,178,255,.22);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#02050d;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body{
      overflow:hidden;
      overscroll-behavior:none;
    }

    .app{
      position:relative;
      width:100%;
      height:100svh;
      min-height:560px;
      overflow:hidden;
      isolation:isolate;
      background:#02050d;
    }

    /* Fondo HD REAL, sin blur */
    .space-bg{
      position:absolute;
      inset:0;
      z-index:-20;
      background:center / cover no-repeat;
      transform:scale(1.01);
    }

    /* Solo un sombreado leve para que el texto sea legible */
    .shade{
      position:absolute;
      inset:0;
      z-index:-18;
      pointer-events:none;
      background:
        linear-gradient(180deg,rgba(0,2,8,.30) 0%,rgba(0,2,8,.08) 24%,rgba(0,2,8,.05) 67%,rgba(0,2,8,.20) 100%),
        radial-gradient(ellipse at 50% 48%,rgba(0,0,0,.02),rgba(0,0,0,.14) 100%);
    }

    .event-layer{
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
      overflow:hidden;
    }

    .ui{
      position:relative;
      z-index:10;
      width:min(100%,560px);
      height:100%;
      margin:0 auto;
      padding:
        max(18px,env(safe-area-inset-top))
        18px
        max(16px,env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .header{
      width:100%;
      text-align:center;
      margin-bottom:clamp(12px,2vh,20px);
      text-shadow:0 2px 14px rgba(0,0,0,.85);
    }

    .kicker{
      margin:0 0 8px;
      font-size:clamp(.64rem,2.5vw,.82rem);
      letter-spacing:.33em;
      text-transform:uppercase;
      color:rgba(255,255,255,.78);
      font-weight:500;
    }

    h1{
      margin:0;
      font-size:clamp(1.72rem,7vw,2.75rem);
      line-height:1;
      font-weight:760;
      text-transform:uppercase;
      letter-spacing:.045em;
    }

    .sub{
      margin:11px auto 0;
      max-width:430px;
      color:rgba(255,255,255,.83);
      font-size:clamp(.83rem,3.1vw,1rem);
      line-height:1.35;
      text-shadow:0 2px 9px rgba(0,0,0,.95);
    }

    .keypad{
      width:min(82vw,390px);
      display:grid;
      grid-template-columns:repeat(3,1fr);
      justify-items:center;
      gap:clamp(10px,2.5vw,16px);
    }

    .key{
      appearance:none;
      -webkit-appearance:none;
      width:clamp(69px,21vw,104px);
      aspect-ratio:1;
      border-radius:50%;
      border:1px solid var(--line);
      background:
        radial-gradient(circle at 35% 25%,rgba(255,255,255,.08),transparent 42%),
        var(--glass);
      color:#fff;
      font-size:clamp(2rem,8.2vw,3.15rem);
      font-weight:260;
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      text-shadow:0 2px 10px rgba(0,0,0,.85);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.025),
        0 6px 20px rgba(0,0,0,.28);
      transition:transform .10s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease;
    }

    .key:active,.key.pressed{
      transform:scale(.91);
      border-color:rgba(255,255,255,.92);
      background:var(--glass-pressed);
      box-shadow:0 0 0 3px rgba(165,210,255,.08),0 0 28px rgba(135,190,255,.28);
    }

    .zero{grid-column:2}

    .status{
      min-height:22px;
      margin-top:clamp(12px,2vh,18px);
      font-size:clamp(.64rem,2.5vw,.8rem);
      letter-spacing:.21em;
      text-transform:uppercase;
      color:rgba(255,255,255,.72);
      text-shadow:0 2px 9px rgba(0,0,0,.95);
      text-align:center;
    }

    /* ===============================
       EVENTOS FOTOGRÁFICOS / REALES
       Sin círculos CSS ni muñequitos SVG
       =============================== */

    .photo-event{
      position:absolute;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
      will-change:transform,opacity;
    }

    /* El negro original de las fotos desaparece visualmente sobre el universo */
    .screen-photo{
      mix-blend-mode:screen;
    }

    /* Astronauta real: foto NASA recortada, no un dibujo */
    .astronaut-wrap{
      top:4%;
      left:-220px;
      width:190px;
      height:225px;
      overflow:hidden;
      animation:astronautPass 18s linear forwards;
      opacity:.92;
    }

    .astronaut-wrap img{
      position:absolute;
      width:325px;
      max-width:none;
      left:-49px;
      top:-79px;
      mix-blend-mode:screen;
    }

    @keyframes astronautPass{
      0%{transform:translateX(-8vw) translateY(0) rotate(-7deg)}
      48%{transform:translateX(61vw) translateY(10px) rotate(4deg)}
      100%{transform:translateX(128vw) translateY(-8px) rotate(14deg)}
    }

    /* Telescopio/sonda real con PNG transparente NASA */
    .satellite-real{
      top:8%;
      left:-240px;
      width:215px;
      animation:satellitePass 15s linear forwards;
      opacity:.94;
    }

    .satellite-real img{
      display:block;
      width:100%;
      filter:drop-shadow(0 4px 10px rgba(0,0,0,.42));
    }

    @keyframes satellitePass{
      0%{transform:translateX(-12vw) rotate(-8deg)}
      100%{transform:translateX(132vw) translateY(42px) rotate(10deg)}
    }

    /* Planetas reales de Hubble */
    .planet-real{
      top:4%;
      right:-210px;
      width:min(62vw,330px);
      animation:planetVisit 13s ease-in-out forwards;
      opacity:0;
    }

    .planet-real.left{
      right:auto;
      left:-210px;
    }

    .planet-real img{
      width:100%;
      display:block;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.30));
    }

    @keyframes planetVisit{
      0%{opacity:0;transform:translateX(35px) scale(.88)}
      18%,78%{opacity:.92;transform:translateX(0) scale(1)}
      100%{opacity:0;transform:translateX(18px) scale(1.02)}
    }

    /* Asteroide Bennu real */
    .asteroid-real{
      top:10%;
      right:-170px;
      width:145px;
      animation:asteroidPass 12s linear forwards;
      opacity:.9;
    }

    .asteroid-real img{
      display:block;
      width:100%;
      filter:contrast(1.08) drop-shadow(0 6px 12px rgba(0,0,0,.36));
    }

    @keyframes asteroidPass{
      0%{transform:translate(12vw,-4vh) rotate(0deg) scale(.78)}
      100%{transform:translate(-138vw,56vh) rotate(290deg) scale(1.08)}
    }

    /* Estrella fugaz: fina y breve, como corresponde */
    .meteor{
      position:absolute;
      width:145px;
      height:2px;
      opacity:0;
      background:linear-gradient(90deg,transparent,rgba(210,235,255,.18) 38%,rgba(255,255,255,.98));
      transform:rotate(-23deg);
      animation:meteorPass 1.1s ease-out forwards;
      box-shadow:8px 0 7px rgba(210,235,255,.18);
    }

    @keyframes meteorPass{
      0%{opacity:0;transform:translate(-20vw,-10vh) rotate(-23deg) scaleX(.45)}
      14%{opacity:1}
      100%{opacity:0;transform:translate(120vw,44vh) rotate(-23deg) scaleX(1)}
    }

    @media(max-height:700px){
      .ui{justify-content:flex-start;padding-top:13px}
      .header{margin-bottom:9px}
      .sub{margin-top:7px}
      .keypad{gap:9px}
      .key{width:min(19vw,84px)}
      .status{margin-top:9px}
    }

    @media(prefers-reduced-motion:reduce){
      .photo-event,.meteor{display:none!important}
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="spaceBg" class="space-bg"></div>
    <div class="shade"></div>
    <div id="eventLayer" class="event-layer" aria-hidden="true"></div>

    <section class="ui">
      <header class="header">
        <p class="kicker">Teléfono de la cava</p>
        <h1>Marque una selección</h1>
        <p class="sub">Elegí un número. Cada línea conecta con una playlist distinta.</p>
      </header>

      <div class="keypad">
        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key zero" data-number="0">0</button>
      </div>

      <div id="status" class="status" aria-live="polite">línea disponible</div>
    </section>
  </main>

  <script>
    /* ============================================================
       PLAYLISTS
       2 queda "próximamente".
       9 = sorpresa aleatoria.
       0 = aleatorio entre todas las playlists ya cargadas.
       ============================================================ */

    const selections = {
      "1": {
        name: "Para empezar",
        url: "https://open.spotify.com/playlist/16QguuMuZbadn8Ll3exMpS"
      },
      "2": {
        name: "Copa de noche",
        url: null
      },
      "3": {
        name: "Música disco",
        url: "https://open.spotify.com/playlist/6Gt1cg31kgPw5FYleLDRSn"
      },
      "4": {
        name: "Clásicos",
        url: "https://open.spotify.com/playlist/2nVzXCq0Bq9rVzWQgB9BWk"
      },
      "5": {
        name: "SebasWit",
        url: "https://open.spotify.com/playlist/7t1n4P09hI38P8m9RKP7XN"
      },
      "6": {
        name: "80's",
        url: "https://open.spotify.com/playlist/7Kfq8BGOINhjpMcU5nSiZL"
      },
      "7": {
        name: "Electrónica",
        url: "https://open.spotify.com/playlist/5B3yHgvHrnwSit19JeezPv"
      },
      "8": {
        name: "Lentos",
        url: "https://open.spotify.com/playlist/0Fhptdnst41dPQG1FXgLog"
      }
    };

    const surprisePool = ["3","4","6","7"];
    const allAvailable = ["1","3","4","5","6","7","8"];

    const statusEl = document.getElementById("status");
    const eventLayer = document.getElementById("eventLayer");
    const keys = [...document.querySelectorAll(".key")];

    /* ============================================================
       FONDOS NASA / WEBB EN HD
       Elegimos uno distinto al cargar.
       ============================================================ */

    const backgrounds = [
      "https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2023/10/STScI-01HBBMF6GFYQG7ECGX1WD3W92B.png?crop=faces%2Cfocalpoint&fit=clip&h=1916&w=2200",
      "https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2024/03/STScI-01HQNVF0HHRF5HH4HKH8S9C83X.png?crop=faces%2Cfocalpoint&fit=clip&h=1785&w=2200",
      "https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2026/02/STScI-01K843KG664WG1FD061J0AFCSH.jpg?crop=faces%2Cfocalpoint&fit=clip&h=1260&w=2450"
    ];

    document.getElementById("spaceBg").style.backgroundImage =
      `url("${backgrounds[Math.floor(Math.random()*backgrounds.length)]}")`;

    /* ============================================================
       AUDIO "TIT"
       ============================================================ */

    function beep(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        const ctx = new AC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(930,ctx.currentTime);
        gain.gain.setValueAtTime(.0001,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.008);
        gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.15);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime+.16);
        osc.onended = () => ctx.close();
      }catch(e){}
    }

    function pressFx(btn){
      btn.classList.add("pressed");
      setTimeout(()=>btn.classList.remove("pressed"),170);
    }

    function goToSelection(key, prefix="conectando"){
      const item = selections[key];
      if(!item || !item.url) return;

      statusEl.textContent = `${prefix} · ${item.name}`;

      setTimeout(()=>{
        window.location.href = item.url;
      },320);
    }

    keys.forEach(btn=>{
      btn.addEventListener("click",()=>{
        const n = btn.dataset.number;
        beep();
        pressFx(btn);

        if(n === "2"){
          statusEl.textContent = "copa de noche · próximamente";
          return;
        }

        if(n === "9"){
          const randomKey = surprisePool[Math.floor(Math.random()*surprisePool.length)];
          goToSelection(randomKey,"sorpresa");
          return;
        }

        if(n === "0"){
          let last = sessionStorage.getItem("cavaLastRandom");
          let choices = allAvailable.filter(k=>k!==last);
          const randomKey = choices[Math.floor(Math.random()*choices.length)];
          sessionStorage.setItem("cavaLastRandom",randomKey);
          goToSelection(randomKey,"aleatorio");
          return;
        }

        goToSelection(n);
      });
    });

    /* ============================================================
       EVENTOS: USAMOS IMÁGENES REALES
       ============================================================ */

    const ASSETS = {
      astronaut:
        "https://assets.science.nasa.gov/dynamicimage/assets/science/psd/lunar-science/2023/09/as09-20-3094_orig.jpg?crop=faces%2Cfocalpoint&fit=clip&h=4095&w=4095",

      telescope:
        "https://science.nasa.gov/wp-content/uploads/2023/05/webb_1.png",

      jupiter:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Jupiter%20%28transparent%29.png",

      saturn:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Saturn%20from%20Hubble.png",

      bennu:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Bennu_mosaic_OSIRIS-REx_%28square%29.png"
    };

    function removeLater(el,ms){
      setTimeout(()=>el.remove(),ms);
    }

    function astronaut(){
      const wrap = document.createElement("div");
      wrap.className = "photo-event astronaut-wrap";
      wrap.innerHTML = `<img src="${ASSETS.astronaut}" alt="">`;
      eventLayer.appendChild(wrap);
      removeLater(wrap,19000);
    }

    function satellite(){
      const wrap = document.createElement("div");
      wrap.className = "photo-event satellite-real";
      wrap.innerHTML = `<img src="${ASSETS.telescope}" alt="">`;
      eventLayer.appendChild(wrap);
      removeLater(wrap,16000);
    }

    function planet(type){
      const wrap = document.createElement("div");
      const left = Math.random()>.5 ? " left" : "";
      wrap.className = "photo-event planet-real"+left;
      wrap.innerHTML = `<img src="${ASSETS[type]}" alt="">`;
      eventLayer.appendChild(wrap);
      removeLater(wrap,14000);
    }

    function asteroid(){
      const wrap = document.createElement("div");
      wrap.className = "photo-event asteroid-real";
      wrap.innerHTML = `<img src="${ASSETS.bennu}" alt="">`;
      eventLayer.appendChild(wrap);
      removeLater(wrap,13000);
    }

    function meteor(){
      const el = document.createElement("div");
      el.className = "meteor";
      el.style.top = `${7+Math.random()*39}%`;
      el.style.left = `${-24+Math.random()*8}%`;
      eventLayer.appendChild(el);
      removeLater(el,1400);
    }

    const mainEvents = [
      astronaut,
      satellite,
      ()=>planet("jupiter"),
      ()=>planet("saturn"),
      asteroid
    ];

    const firstIndex = Math.floor(Math.random()*mainEvents.length);
    setTimeout(mainEvents[firstIndex],1000+Math.random()*1300);

    /* Segundo evento distinto si la persona se queda mirando */
    setTimeout(()=>{
      let secondIndex;
      do{
        secondIndex = Math.floor(Math.random()*mainEvents.length);
      }while(secondIndex===firstIndex);
      mainEvents[secondIndex]();
    },15000+Math.random()*5500);

    /* Estrella fugaz muy ocasional */
    function scheduleMeteor(){
      setTimeout(()=>{
        meteor();
        scheduleMeteor();
      },7000+Math.random()*10500);
    }
    scheduleMeteor();
  </script>
</body>
</html>
