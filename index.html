<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020611" />
  <title>Teléfono de la Cava</title>

  <style>
    :root{
      --white:#f8fbff;
      --muted:rgba(255,255,255,.72);
      --line:rgba(205,228,255,.34);
      --glass:rgba(2,7,18,.38);
      --glass-pressed:rgba(120,180,255,.22);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#020611;
      color:var(--white);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body{
      overflow:hidden;
      overscroll-behavior:none;
    }

    .app{
      position:relative;
      width:100%;
      height:100svh;
      min-height:560px;
      overflow:hidden;
      isolation:isolate;
      background:#020611;
    }

    /* IMAGEN REAL DEL UNIVERSO, SIN BLUR */
    .space-photo{
      position:absolute;
      inset:0;
      z-index:-10;
      background-position:center;
      background-repeat:no-repeat;
      background-size:cover;
      transform:scale(1.015);
    }

    /* Solo oscurece levemente el centro para que se lean los números.
       No desenfoca nada. */
    .space-shade{
      position:absolute;
      inset:0;
      z-index:-8;
      pointer-events:none;
      background:
        linear-gradient(180deg, rgba(0,4,13,.26) 0%, rgba(0,4,13,.08) 24%, rgba(0,4,13,.10) 76%, rgba(0,4,13,.30) 100%),
        radial-gradient(ellipse at center, rgba(0,4,13,.08) 0%, rgba(0,4,13,.04) 52%, rgba(0,0,0,.20) 100%);
    }

    /* Estrellas extra muy finas, para mantener profundidad aun cuando
       la foto elegida tenga zonas más oscuras. */
    .sharp-stars,
    .sharp-stars::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-7;
      pointer-events:none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.98) 0 1px, transparent 1.35px),
        radial-gradient(circle, rgba(205,226,255,.9) 0 1px, transparent 1.3px);
      background-size:101px 101px, 173px 173px;
      background-position:12px 21px, 71px 39px;
      opacity:.44;
    }
    .sharp-stars::before{
      inset:0;
      background-size:227px 227px, 311px 311px;
      background-position:33px 92px, 144px 18px;
      opacity:.40;
    }

    .event-layer{
      position:absolute;
      inset:0;
      z-index:1;
      overflow:hidden;
      pointer-events:none;
    }

    .ui{
      position:relative;
      z-index:10;
      height:100%;
      width:min(100%,560px);
      margin:0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        18px
        max(16px, env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .top{
      width:100%;
      text-align:center;
      margin-bottom:clamp(12px,2.2vh,22px);
      text-shadow:0 2px 12px rgba(0,0,0,.82);
    }

    .kicker{
      margin:0 0 7px;
      font-size:clamp(.64rem,2.4vw,.82rem);
      letter-spacing:.34em;
      text-transform:uppercase;
      color:rgba(255,255,255,.72);
      font-weight:500;
    }

    h1{
      margin:0;
      font-size:clamp(1.72rem,7vw,2.8rem);
      line-height:.98;
      letter-spacing:.055em;
      text-transform:uppercase;
      font-weight:760;
    }

    .subtitle{
      margin:10px auto 0;
      max-width:420px;
      font-size:clamp(.82rem,3.1vw,1rem);
      line-height:1.35;
      letter-spacing:.035em;
      color:rgba(255,255,255,.77);
    }

    /* SIN panel borroso: los botones flotan sobre el universo */
    .keypad{
      width:min(82vw,390px);
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:clamp(10px,2.3vw,16px);
      align-items:center;
      justify-items:center;
    }

    .key{
      appearance:none;
      -webkit-appearance:none;
      width:clamp(68px,21vw,104px);
      aspect-ratio:1/1;
      border-radius:50%;
      border:1px solid var(--line);
      background:
        radial-gradient(circle at 36% 26%, rgba(255,255,255,.08), transparent 42%),
        var(--glass);
      color:white;
      font-size:clamp(2rem,8.2vw,3.15rem);
      font-weight:280;
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      text-shadow:0 2px 10px rgba(0,0,0,.8);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.035),
        0 5px 18px rgba(0,0,0,.32);
      transition:transform .11s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease;
    }

    @media (hover:hover) and (pointer:fine){
      .key:hover{
        transform:translateY(-2px);
        border-color:rgba(225,240,255,.68);
        box-shadow:0 9px 26px rgba(0,0,0,.38), inset 0 0 18px rgba(160,205,255,.08);
      }
    }

    .key:active,
    .key.pressed{
      transform:scale(.92);
      border-color:rgba(235,247,255,.94);
      background:var(--glass-pressed);
      box-shadow:0 0 0 3px rgba(180,220,255,.08),0 0 28px rgba(125,192,255,.25);
    }

    .zero{grid-column:2}

    .status{
      margin-top:clamp(12px,2.1vh,20px);
      min-height:20px;
      font-size:clamp(.66rem,2.5vw,.8rem);
      letter-spacing:.24em;
      text-transform:uppercase;
      color:rgba(255,255,255,.68);
      text-shadow:0 2px 10px rgba(0,0,0,.8);
    }

    /* ========== OBJETOS CÓSMICOS NÍTIDOS ========== */

    .flyer{
      position:absolute;
      will-change:transform;
      filter:none;
    }

    .flyer svg{
      display:block;
      width:100%;
      height:100%;
      overflow:visible;
    }

    .astronaut{
      top:6%;
      left:-130px;
      width:96px;
      height:122px;
      animation:astronautPass 18s linear forwards;
    }

    @keyframes astronautPass{
      0%{transform:translateX(-10vw) translateY(8px) rotate(-12deg)}
      50%{transform:translateX(58vw) translateY(-8px) rotate(5deg)}
      100%{transform:translateX(122vw) translateY(13px) rotate(17deg)}
    }

    .satellite{
      top:13%;
      left:-150px;
      width:138px;
      height:86px;
      animation:satellitePass 14s linear forwards;
    }

    @keyframes satellitePass{
      0%{transform:translateX(-10vw) translateY(0) rotate(-7deg)}
      100%{transform:translateX(125vw) translateY(28px) rotate(8deg)}
    }

    .planet-event{
      position:absolute;
      width:min(48vw,270px);
      aspect-ratio:1/1;
      border-radius:50%;
      right:-18%;
      top:6%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.62) 0 2%, transparent 2.5%),
        radial-gradient(circle at 38% 36%, #b59e7a 0 4%, #87755f 28%, #4a423d 57%, #171b26 76%);
      box-shadow:
        inset -38px -26px 48px rgba(0,0,0,.7),
        0 0 0 1px rgba(255,255,255,.10);
      animation:planetReveal 13s ease-in-out forwards;
    }

    @keyframes planetReveal{
      0%{opacity:0;transform:translateX(40px) scale(.86)}
      18%,78%{opacity:.96;transform:translateX(0) scale(1)}
      100%{opacity:0;transform:translateX(18px) scale(1.02)}
    }

    .sun-event{
      position:absolute;
      width:min(42vw,240px);
      aspect-ratio:1/1;
      border-radius:50%;
      left:-15%;
      top:8%;
      background:
        radial-gradient(circle at 42% 40%, #fffde9 0 6%, #ffe296 17%, #ffb74e 41%, #f46b24 67%, #8b240f 100%);
      box-shadow:
        0 0 18px rgba(255,196,92,.58),
        0 0 48px rgba(255,129,47,.30);
      animation:sunReveal 11s ease-in-out forwards;
    }

    @keyframes sunReveal{
      0%{opacity:0;transform:scale(.84)}
      20%,76%{opacity:1;transform:scale(1)}
      100%{opacity:0;transform:scale(1.04)}
    }

    .comet{
      position:absolute;
      top:17%;
      right:-180px;
      width:190px;
      height:80px;
      animation:cometPass 7s ease-in forwards;
      transform:rotate(-18deg);
    }

    @keyframes cometPass{
      from{transform:translate(5vw,-5vh) rotate(-18deg)}
      to{transform:translate(-135vw,48vh) rotate(-18deg)}
    }

    .supernova{
      position:absolute;
      top:13%;
      left:69%;
      width:120px;
      height:120px;
      transform:translate(-50%,-50%);
      opacity:0;
      animation:supernova 5.4s ease-out forwards;
    }

    @keyframes supernova{
      0%,22%{opacity:0;transform:translate(-50%,-50%) scale(.15)}
      30%{opacity:1;transform:translate(-50%,-50%) scale(.55)}
      45%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(1.55)}
    }

    .meteor{
      position:absolute;
      width:150px;
      height:2px;
      background:linear-gradient(90deg,transparent 0%,rgba(210,235,255,.18) 42%,#fff 100%);
      opacity:0;
      animation:meteor 1.15s ease-out forwards;
      transform:rotate(-24deg);
    }

    @keyframes meteor{
      0%{opacity:0;transform:translate(-18vw,-10vh) rotate(-24deg) scaleX(.45)}
      16%{opacity:1}
      100%{opacity:0;transform:translate(118vw,43vh) rotate(-24deg) scaleX(1)}
    }

    @media (max-height:700px){
      .ui{justify-content:flex-start;padding-top:14px}
      .top{margin-bottom:10px}
      .subtitle{margin-top:6px}
      .keypad{gap:9px}
      .key{width:min(19vw,84px)}
      .status{margin-top:9px}
    }

    @media (prefers-reduced-motion:reduce){
      .flyer,.planet-event,.sun-event,.comet,.supernova,.meteor{display:none}
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="spacePhoto" class="space-photo" aria-hidden="true"></div>
    <div class="space-shade" aria-hidden="true"></div>
    <div class="sharp-stars" aria-hidden="true"></div>
    <div id="eventLayer" class="event-layer" aria-hidden="true"></div>

    <section class="ui" aria-label="Selector de playlists">
      <header class="top">
        <p class="kicker">Teléfono de la cava</p>
        <h1>Marque una selección</h1>
        <p class="subtitle">Elegí un número. Cada línea conecta con una playlist distinta.</p>
      </header>

      <div class="keypad" id="keypad">
        <button class="key" data-number="1" aria-label="Selección 1">1</button>
        <button class="key" data-number="2" aria-label="Selección 2">2</button>
        <button class="key" data-number="3" aria-label="Selección 3">3</button>
        <button class="key" data-number="4" aria-label="Selección 4">4</button>
        <button class="key" data-number="5" aria-label="Selección 5">5</button>
        <button class="key" data-number="6" aria-label="Selección 6">6</button>
        <button class="key" data-number="7" aria-label="Selección 7">7</button>
        <button class="key" data-number="8" aria-label="Selección 8">8</button>
        <button class="key" data-number="9" aria-label="Selección 9">9</button>
        <button class="key zero" data-number="0" aria-label="Selección 0">0</button>
      </div>

      <div id="status" class="status" aria-live="polite">línea disponible</div>
    </section>
  </main>

  <script>
    /* =========================================================
       PLAYLISTS
       Reemplazá estos enlaces por los tuyos.
       5 queda reservado para SebasWit.
       ========================================================= */
    const playlists = {
      "1": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_1",
      "2": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_2",
      "3": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_3",
      "4": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_4",
      "5": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_SEBASWIT",
      "6": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_6",
      "7": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_7",
      "8": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_8",
      "9": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_9",
      "0": "https://open.spotify.com/playlist/PEGA_AQUI_PLAYLIST_0"
    };

    /* =========================================================
       FONDOS REALES NASA / JAMES WEBB
       Cada carga elige uno al azar.
       No hay blur ni filtro de desenfoque.
       ========================================================= */
    const spaceScenes = [
      {
        name: "Crab Nebula",
        url: "https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2023/10/STScI-01HBBMF6GFYQG7ECGX1WD3W92B.png?crop=faces%2Cfocalpoint&fit=clip&h=1916&w=2200",
        position: "50% 50%"
      },
      {
        name: "NGC 604",
        url: "https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2024/03/STScI-01HQNVF0HHRF5HH4HKH8S9C83X.png?crop=faces%2Cfocalpoint&fit=clip&h=1785&w=2200",
        position: "52% 50%"
      },
      {
        name: "Exposed Cranium Nebula",
        url: "https://assets.science.nasa.gov/dynamicimage/assets/science/missions/webb/science/2026/02/STScI-01K843KG664WG1FD061J0AFCSH.jpg?crop=faces%2Cfocalpoint&fit=clip&h=1260&w=2450",
        position: "16% 50%"
      }
    ];

    const photo = document.getElementById("spacePhoto");
    const eventLayer = document.getElementById("eventLayer");
    const statusEl = document.getElementById("status");
    const keys = [...document.querySelectorAll(".key")];

    const scene = spaceScenes[Math.floor(Math.random() * spaceScenes.length)];
    photo.style.backgroundImage = `url("${scene.url}")`;
    photo.style.backgroundPosition = scene.position;

    /* Precarga la siguiente imagen para que futuras visitas/cambios sean rápidos. */
    spaceScenes.forEach(s => {
      const img = new Image();
      img.src = s.url;
    });

    /* ---------- SONIDO "TIT" ---------- */
    function beep(){
      try{
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(920, ctx.currentTime);
        gain.gain.setValueAtTime(.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.20, ctx.currentTime + .01);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .16);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + .17);
        osc.onended = () => ctx.close();
      }catch(e){}
    }

    /* ---------- BOTONES ---------- */
    keys.forEach(key => {
      key.addEventListener("click", () => {
        const n = key.dataset.number;
        const url = playlists[n];

        beep();
        key.classList.add("pressed");
        statusEl.textContent = `conectando selección ${n}`;

        setTimeout(() => key.classList.remove("pressed"), 170);

        setTimeout(() => {
          if(!url || url.includes("PEGA_AQUI")){
            statusEl.textContent = `falta cargar la playlist ${n}`;
            return;
          }
          window.location.href = url;
        }, 280);
      });
    });

    /* =========================================================
       OBJETOS NÍTIDOS
       Son SVG/CSS, no emojis ampliados ni manchas borrosas.
       ========================================================= */

    function mount(html, className, lifetime){
      const el = document.createElement("div");
      el.className = className;
      el.innerHTML = html;
      eventLayer.appendChild(el);
      setTimeout(() => el.remove(), lifetime);
    }

    function showAstronaut(){
      mount(`
        <svg viewBox="0 0 100 130" role="img" aria-label="Astronauta">
          <defs>
            <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset=".55" stop-color="#cbd6df"/>
              <stop offset="1" stop-color="#7e8b98"/>
            </linearGradient>
            <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffd08a"/>
              <stop offset=".4" stop-color="#8a5b2d"/>
              <stop offset="1" stop-color="#07111f"/>
            </linearGradient>
          </defs>
          <ellipse cx="50" cy="28" rx="24" ry="25" fill="url(#suit)" stroke="#ffffff" stroke-width="2"/>
          <ellipse cx="50" cy="29" rx="17" ry="16" fill="url(#visor)" stroke="#dcecff" stroke-width="1.5"/>
          <rect x="27" y="49" width="46" height="48" rx="14" fill="url(#suit)" stroke="#f5fbff" stroke-width="2"/>
          <rect x="39" y="58" width="23" height="15" rx="3" fill="#667482" stroke="#dfeaf2"/>
          <path d="M30 58 L8 76 Q4 80 9 84 L34 72" fill="url(#suit)" stroke="#eef7ff" stroke-width="5" stroke-linecap="round"/>
          <path d="M70 58 L92 72 Q97 75 93 80 L66 72" fill="url(#suit)" stroke="#eef7ff" stroke-width="5" stroke-linecap="round"/>
          <path d="M40 94 L31 121" stroke="#dbe6ee" stroke-width="10" stroke-linecap="round"/>
          <path d="M60 94 L70 120" stroke="#dbe6ee" stroke-width="10" stroke-linecap="round"/>
          <rect x="21" y="53" width="8" height="35" rx="3" fill="#6d7883"/>
          <circle cx="45" cy="64" r="2" fill="#ff5e5e"/>
          <circle cx="51" cy="64" r="2" fill="#6ad9ff"/>
        </svg>
      `, "flyer astronaut", 19000);
    }

    function showSatellite(){
      mount(`
        <svg viewBox="0 0 160 100" role="img" aria-label="Satélite">
          <defs>
            <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#eef6ff"/>
              <stop offset=".48" stop-color="#9aa8b6"/>
              <stop offset="1" stop-color="#4b5662"/>
            </linearGradient>
            <linearGradient id="solar" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#204d88"/>
              <stop offset="1" stop-color="#071f4a"/>
            </linearGradient>
          </defs>
          <rect x="58" y="27" width="44" height="45" rx="5" fill="url(#metal)" stroke="#ffffff" stroke-width="1.5"/>
          <circle cx="80" cy="49" r="10" fill="#172332" stroke="#dcefff"/>
          <rect x="4" y="31" width="49" height="36" fill="url(#solar)" stroke="#9bc4ff"/>
          <rect x="107" y="31" width="49" height="36" fill="url(#solar)" stroke="#9bc4ff"/>
          <g stroke="#74a8e8" stroke-width="1">
            <path d="M20 31v36M36 31v36M123 31v36M140 31v36"/>
            <path d="M4 43h49M4 55h49M107 43h49M107 55h49"/>
          </g>
          <path d="M80 27 V11" stroke="#dcefff" stroke-width="2"/>
          <circle cx="80" cy="9" r="3" fill="#ffffff"/>
          <path d="M79 72 L66 92 M81 72 L95 92" stroke="#cdd9e4" stroke-width="2"/>
        </svg>
      `, "flyer satellite", 15000);
    }

    function showComet(){
      mount(`
        <svg viewBox="0 0 220 90" role="img" aria-label="Cometa">
          <defs>
            <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="rgba(120,205,255,0)"/>
              <stop offset=".68" stop-color="#8bd5ff" stop-opacity=".46"/>
              <stop offset="1" stop-color="#f5fdff" stop-opacity=".95"/>
            </linearGradient>
            <radialGradient id="core">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset=".45" stop-color="#bfe8ff"/>
              <stop offset="1" stop-color="#5599c5"/>
            </radialGradient>
          </defs>
          <path d="M4 44 C65 31,130 35,193 44 C125 52,62 57,4 44Z" fill="url(#tail)"/>
          <circle cx="199" cy="44" r="11" fill="url(#core)" stroke="#ffffff"/>
          <path d="M202 35l6 7-5 8-8 3-7-7 3-9z" fill="#d9e8ef" opacity=".7"/>
        </svg>
      `, "comet", 8000);
    }

    function showPlanet(){
      const el = document.createElement("div");
      el.className = "planet-event";
      eventLayer.appendChild(el);
      setTimeout(() => el.remove(), 14000);
    }

    function showSun(){
      const el = document.createElement("div");
      el.className = "sun-event";
      eventLayer.appendChild(el);
      setTimeout(() => el.remove(), 12000);
    }

    function showSupernova(){
      mount(`
        <svg viewBox="0 0 120 120" role="img" aria-label="Supernova">
          <defs>
            <radialGradient id="nova">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset=".18" stop-color="#fff4bd"/>
              <stop offset=".45" stop-color="#ffbd67" stop-opacity=".95"/>
              <stop offset=".72" stop-color="#9b72ff" stop-opacity=".44"/>
              <stop offset="1" stop-color="#6f54ff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="60" cy="60" r="58" fill="url(#nova)"/>
          <g stroke="#ffffff" stroke-linecap="round">
            <path d="M60 3v114" stroke-width="2"/>
            <path d="M3 60h114" stroke-width="2"/>
            <path d="M19 19l82 82" stroke-width="1"/>
            <path d="M101 19L19 101" stroke-width="1"/>
          </g>
          <circle cx="60" cy="60" r="7" fill="#ffffff"/>
        </svg>
      `, "supernova", 5900);
    }

    const mainEvents = [
      showAstronaut,
      showSatellite,
      showComet,
      showPlanet,
      showSun,
      showSupernova
    ];

    const firstEvent = mainEvents[Math.floor(Math.random() * mainEvents.length)];
    setTimeout(firstEvent, 900 + Math.random() * 1200);

    /* Una segunda sorpresa, distinta, si la página queda abierta. */
    setTimeout(() => {
      let second;
      do{
        second = mainEvents[Math.floor(Math.random() * mainEvents.length)];
      }while(second === firstEvent);
      second();
    }, 14500 + Math.random() * 6500);

    /* Estrellas fugaces ocasionales y NÍTIDAS. */
    function meteor(){
      const el = document.createElement("div");
      el.className = "meteor";
      el.style.top = `${7 + Math.random()*42}%`;
      el.style.left = `${-22 + Math.random()*8}%`;
      eventLayer.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }

    function scheduleMeteor(){
      setTimeout(() => {
        meteor();
        scheduleMeteor();
      }, 6500 + Math.random()*9000);
    }

    scheduleMeteor();
  </script>
</body>
</html>
